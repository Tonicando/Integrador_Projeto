<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="criar_conta.js"></script>
    <link rel="stylesheet" href="criar-conta.css">
</head>
<body>

    <main class="container">

        <section class="left">

            <img src="../Imagens/logo_folha.png" alt="Logo">

            <h1>Sabor da Terra</h1>

            <p>
                Produtos orgânicos e artesanais direto do campo para sua mesa.
            </p>

        </section>

        <section class="right">

            <h2>Criar Conta</h2>

            <span>Cadastre-se para continuar</span>
            <form id="formCadastro">
                    <label>Nome</label>
                    <input type="text" id="nome" placeholder="Digite seu nome">

                    <label>Email</label>
                    <input type="email" id="email" placeholder="Digite seu email">

                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha">

                    <label>Confirmar senha</label>
                    <input type="password" id="confirmarSenha" placeholder="Confirme sua senha">
                    <p id="erroSenha" class="erro"></p>
                    <button type="submit" class="btn-criar">
                        Criar Conta
                    </button>
                    <p class="login-link">
                        Já tem uma conta?
                        <a href="login.html" target="_blank">Entrar</a>
                    </p>

            </form>

        </section>

    </main>

</body>
</html>
