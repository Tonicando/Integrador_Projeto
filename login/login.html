<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar</title>
<link rel="stylesheet" href="login.css">
<link rel="icon" type="image/x-icon" href="../Imagens/favicon.ico?v=1">
<script src="login.js"></script>
</head>
<body>

    <div class="login-box">

        <img src="../Imagens/logo_folha.png" width="90px" alt="Logo">

        <h1>Conecte-se agora</h1>

        <form id="loginForm">

            <label>Email</label>
            <input type="email" id="email" placeholder="Digite seu email" required>

            <label>Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>
                <button type="submit" class="btn-criar">
                    Entrar
                </button>

                <p id="erroLogin" class="erro"></p>
        </form>

        <div class="links">
            <a href="criar_conta.html" target="_blank">Não tem uma conta?</a>
        </div>

    </div>


</body>
</html>
